<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, intial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <title>To-Do List App</title>
    </head>   
    <body>
        <div class="container">
            <header>
                <h1>To-Do List</h1>
            </header>
            
            <main>
                <section class="add-task-section">
                    <form action="/add" method="post" class="add-task-form">
                        <div class="input-group">
                            <input type="text" name="new_task" placeholder="Enter a task..." required>
                            <button type="submit" class="add-btn">Add Task</button>
                        </div>
                    </form>
                </section>
                
                <section class="tasks-section">
                    <h2>Your Tasks</h2>
                    <ul class="task-list">
                        {% for task in tasks %}
                        <li class="task-item"> 
                            <span class="task-text">{{ task[1] }}</span>
                            <form action="/complete/{{ task[0] }}" method="post" class="complete-form">
                                <button type="submit" class="complete-btn">Complete</button>
                            </form>
                        </li>  
                        {% endfor %} 
                    
                        
                    </ul>
                </section>


                <section class="completed-section">
                    <h2>Completed Tasks</h2>
                    <ul class="completed-list">
                        {% for task in completed_tasks %}
                        <li class="completed-item">
                            <span class="task-text">{{ task[1] }}</span>
                            <div class="task-actions">
                                <form action="/uncomplete/{{ task[0] }}" method="post" class="uncomplete-form">
                                    <button type="submit" class="uncomplete-btn">Uncomplete</button>
                                </form>
                                <form action="/delete/{{ task[0] }}" method="post" class="delete-form">
                                    <button type="submit" class="delete-btn">Delete</button>
                                </form>
                            </div>
                        </li>
                        {% endfor %}
                    </ul>
                </section>
            </main>
        </div>
    </body>
</html>
